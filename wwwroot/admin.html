<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/admin.css">

</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <span class="navbar-brand">

                🛡 Panel Administrador

            </span>

            <button class="btn btn-outline-light"
                    id="btnVolver">

                Volver al mapa

            </button>

        </div>

    </nav>


    <div class="container py-4">

        <div class="row g-4">

            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h5>Reclamos activos</h5>

                        <h2 id="activos">

                            ...

                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h5>Votos</h5>

                        <h2 id="votos">

                            ...

                        </h2>

                    </div>

                </div>

            </div>


            <div class="col-md-4">

                <div class="card shadow-sm">

                    <div class="card-body">

                        <h5>Total Reclamos</h5>

                        <h2 id="cantidad">

                            ...

                        </h2>

                    </div>

                </div>

            </div>

        </div>


        <hr class="my-5">


        <h3>

            Reclamos

        </h3>


        <table class="table table-hover mt-4">

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Título</th>

                    <th>Estado</th>

                    <th>Zona</th>

                    <th>Apoyos</th>

                    <th></th>

                </tr>

            </thead>

            <tbody id="tablaReclamos">
            </tbody>

        </table>

    </div>

    <!-- ================= MODAL DETALLE ================= -->

    <div class="modal fade"
         id="modalDetalle"
         tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h4 class="modal-title">

                        Detalle del Reclamo

                    </h4>

                    <button class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <h3 id="detalleTitulo"></h3>

                    <p id="detalleDescripcion"></p>

                    <hr>

                    <p>
                        <strong>Dirección:</strong>
                        <span id="detalleDireccion"></span>
                    </p>

                    <p>
                        <strong>Zona:</strong>
                        <span id="detalleZona"></span>
                    </p>

                    <div class="mb-3">

                        <label class="form-label">

                            Estado

                        </label>

                        <select id="nuevoEstado"
                                class="form-select">

                            <option>Recibido</option>

                            <option>En revisión</option>

                            <option>En proceso</option>

                            <option>Solucionado</option>

                            <option>Rechazado</option>

                        </select>

                    </div>

                    <p>
                        <strong>Apoyos:</strong>
                        <span id="detalleApoyos"></span>
                    </p>

                    <hr>

                    <h5>Creado por</h5>

                    <div id="detalleUsuario"></div>

                    <hr>

                    <h5>Administrador asignado</h5>

                    <div id="detalleAdministrador"></div>

                    <hr>

                    <h5>Historial</h5>

                    <div id="detalleHistorial"></div>

                    <hr>

                    <div class="text-end">

                        <button class="btn btn-success"
                                id="btnGuardarEstado">

                            Guardar Estado

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
