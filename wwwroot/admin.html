<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Panel Administrador</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/admin.css">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>

<body>

    <nav class="navbar navbar-dark bg-dark">

        <div class="container-fluid">

            <span class="navbar-brand">

                🛡 Panel Administrador

            </span>

            <button class="btn btn-outline-light"
                    id="btnVolver">

                Volver al mapa

            </button>

        </div>

    </nav>


    <div class="container py-4">

        <div class="row g-4 mb-5">

            <div class="col-lg-3">

                <div class="card shadow-sm border-0 stat-card">

                    <div class="card-body">

                        <div class="stat-icon bg-primary">

                            <i class="fa-solid fa-location-dot"></i>

                        </div>

                        <h6>Reclamos activos</h6>

                        <h2 id="activos">0</h2>

                        <small class="text-muted">

                            En toda la ciudad

                        </small>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card shadow-sm border-0 stat-card">

                    <div class="card-body">

                        <div class="stat-icon bg-danger">

                            <i class="fa-solid fa-heart"></i>

                        </div>

                        <h6>Total de apoyos</h6>

                        <h2 id="votos">0</h2>

                        <small class="text-muted">

                            Apoyos realizados

                        </small>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card shadow-sm border-0 stat-card">

                    <div class="card-body">

                        <div class="stat-icon bg-warning">

                            <i class="fa-solid fa-clock"></i>

                        </div>

                        <h6>En revisión</h6>

                        <h2 id="revision">0</h2>

                        <small class="text-muted">

                            Pendientes

                        </small>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card shadow-sm border-0 stat-card">

                    <div class="card-body">

                        <div class="stat-icon bg-success">

                            <i class="fa-solid fa-circle-check"></i>

                        </div>

                        <h6>Solucionados</h6>

                        <h2 id="solucionados">0</h2>

                        <small class="text-muted">

                            Finalizados

                        </small>

                    </div>

                </div>

            </div>

        </div>


        <hr class="my-5">


        <h3>

            Reclamos

        </h3>

        <div class="row mb-3">

            <div class="col-md-6">

                <input id="buscarReclamo"
                       class="form-control"
                       placeholder="Buscar por título, dirección o zona...">

            </div>

        </div>


        <div id="listaReclamos" class="row g-4 mt-2">

        </div>

    </div>

    <!-- ================= MODAL DETALLE ================= -->

    <div class="modal fade"
         id="modalDetalle"
         tabindex="-1">

        <div class="modal-dialog modal-lg">

            <div class="modal-content">

                <div class="modal-header">

                    <h4 class="modal-title">

                        Detalle del Reclamo

                    </h4>

                    <button class="btn-close"
                            data-bs-dismiss="modal">
                    </button>

                </div>

                <div class="modal-body">

                    <h3 id="detalleTitulo"></h3>

                    <p id="detalleDescripcion"></p>

                    <hr>

                    <p>
                        <strong>Dirección:</strong>
                        <span id="detalleDireccion"></span>
                    </p>

                    <p>
                        <strong>Zona:</strong>
                        <span id="detalleZona"></span>
                    </p>

                    <div class="mb-3">

                        <label class="form-label">

                            Estado

                        </label>

                        <select id="nuevoEstado"
                                class="form-select">

                            <option>Recibido</option>

                            <option>En revisión</option>

                            <option>En proceso</option>

                            <option>Solucionado</option>

                            <option>Rechazado</option>

                        </select>

                    </div>

                    <p>
                        <strong>Apoyos:</strong>
                        <span id="detalleApoyos"></span>
                    </p>

                    <hr>

                    <h5>Creado por</h5>

                    <div id="detalleUsuario"></div>

                    <hr>

                    <h5>Administrador asignado</h5>

                    <div id="detalleAdministrador"></div>

                    <hr>

                    <h5>Historial</h5>

                    <div id="detalleHistorial"></div>

                    <hr>

                    <div class="text-end">

                        <button class="btn btn-success"
                                id="btnGuardarEstado">

                            Guardar Estado

                        </button>

                    </div>

                </div>

            </div>

        </div>

    </div>



    <div class="toast-container position-fixed bottom-0 end-0 p-3">

        <div id="toastGlobal"
             class="toast"
             role="alert">

            <div class="toast-header">

                <strong id="toastTitulo"
                        class="me-auto">
                    Mar del Plata Transparente
                </strong>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="toast">
                </button>

            </div>

            <div id="toastMensaje"
                 class="toast-body">
            </div>

        </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/security.js"></script>
    <script src="js/api.js"></script>

    <script src="js/toast.js"></script>

    <script src="js/admin.js"></script>

</body>

</html>
