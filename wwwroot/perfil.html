<!DOCTYPE html>
<html lang="es">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mi Perfil - MDP Transparente</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">

    <link rel="stylesheet"
          href="css/variables.css">

    <link rel="icon" href="/favicon.ico" type="image/x-icon">
</head>

<body class="bg-light">

    <!-- NAVBAR -->

    <nav class="navbar navbar-dark bg-dark">

        <div class="container">

            <a href="/"
               class="navbar-brand fw-bold">

                <i class="fa-solid fa-location-dot me-2"></i>
                MDP Transparente

            </a>

            <a href="/"
               class="btn btn-outline-light">

                <i class="fa-solid fa-arrow-left me-2"></i>
                Volver al mapa

            </a>

        </div>

    </nav>


    <!-- CONTENIDO -->

    <main class="container py-5">

        <div class="row justify-content-center">

            <div class="col-lg-8">

                <!-- PERFIL -->

                <div class="card shadow-sm border-0 mb-4">

                    <div class="card-body p-4">

                        <div class="d-flex align-items-center mb-4">

                            <div class="me-3">

                                <div class="rounded-circle bg-primary text-white
                                            d-flex align-items-center justify-content-center"
                                     style="width:70px;height:70px;font-size:28px;">

                                    <i class="fa-solid fa-user"></i>

                                </div>

                            </div>

                            <div>

                                <h2 id="perfilNombre"
                                    class="mb-1">

                                    Cargando...

                                </h2>

                                <span id="perfilRol"
                                      class="badge bg-primary">

                                    Usuario

                                </span>

                            </div>

                        </div>


                        <hr>


                        <div class="row g-4 mt-1">

                            <div class="col-md-6">

                                <small class="text-muted">
                                    Nombre
                                </small>

                                <div id="perfilNombreDetalle"
                                     class="fw-semibold">

                                    ...

                                </div>

                            </div>


                            <div class="col-md-6">

                                <small class="text-muted">
                                    Email
                                </small>

                                <div id="perfilEmail"
                                     class="fw-semibold">

                                    ...

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ESTADÍSTICAS -->

                <div class="row g-3">

                    <div class="col-md-6">

                        <div class="card shadow-sm border-0 h-100">

                            <div class="card-body">

                                <div class="d-flex align-items-center">

                                    <div class="fs-2 me-3">
                                        <i class="fa-solid fa-bullhorn"></i>
                                    </div>

                                    <div>

                                        <div class="text-muted">
                                            Reclamos realizados
                                        </div>

                                        <h3 id="perfilReclamos"
                                            class="mb-0">

                                            0

                                        </h3>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>


                    <div class="col-md-6">

                        <div class="card shadow-sm border-0 h-100">

                            <div class="card-body">

                                <div class="d-flex align-items-center">

                                    <div class="fs-2 me-3">
                                        <i class="fa-solid fa-thumbs-up"></i>
                                    </div>

                                    <div>

                                        <div class="text-muted">
                                            Apoyos realizados
                                        </div>

                                        <h3 id="perfilApoyos"
                                            class="mb-0">

                                            0

                                        </h3>

                                    </div>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- ACCIONES -->

                <div class="card shadow-sm border-0 mt-4">

                    <div class="card-body">

                        <h5 class="fw-bold mb-3">
                            Mi cuenta
                        </h5>

                        <div class="d-grid gap-2">

                            <a href="/mis-reclamos.html"
                               class="btn btn-outline-primary text-start">

                                <i class="fa-solid fa-list me-2"></i>

                                Ver mis reclamos

                            </a>

                            <button id="btnCerrarSesionPerfil"
                                    class="btn btn-outline-danger text-start">

                                <i class="fa-solid fa-right-from-bracket me-2"></i>

                                Cerrar sesión

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>

    </main>


    <!-- TOAST -->

    <div class="toast-container position-fixed bottom-0 end-0 p-3">

        <div id="toastGlobal"
             class="toast"
             role="alert">

            <div class="toast-header">

                <strong id="toastTitulo"
                        class="me-auto">

                    MDP Transparente

                </strong>

                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="toast">
                </button>

            </div>

            <div id="toastMensaje"
                 class="toast-body">
            </div>

        </div>

    </div>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/js/bootstrap.bundle.min.js"></script>

    <script src="js/api.js"></script>
    <script src="js/perfil.js"></script>

</body>

</html>
